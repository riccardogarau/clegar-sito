<svg viewBox="0 0 1300 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Examples of offshore project problems, each shown from the phase where it originates to the phase where it is found">
<text class="it" font-family="Archivo, sans-serif" x="0.0" y="52.0" font-size="18" fill="#0B2545" text-anchor="start">Quanto tardi si scopre, quanto costa rimediare</text>
<text class="en" font-family="Archivo, sans-serif" x="0.0" y="52.0" font-size="18" fill="#0B2545" text-anchor="start">How late it is found, how much it costs to put right</text>
<text class="it" font-family="IBM Plex Mono, monospace" letter-spacing="1.1" x="0.0" y="76.0" font-size="14" fill="#8B9598" text-anchor="start">OGNI CUNEO VA DA DOVE IL PROBLEMA NASCE A DOVE SI SCOPRE</text>
<text class="en" font-family="IBM Plex Mono, monospace" letter-spacing="1.1" x="0.0" y="76.0" font-size="14" fill="#8B9598" text-anchor="start">EACH WEDGE RUNS FROM WHERE A PROBLEM STARTS TO WHERE IT IS FOUND</text>
<text class="it" font-family="IBM Plex Mono, monospace" letter-spacing="1.1" x="0.0" y="98.0" font-size="14" fill="#8B9598" text-anchor="start">LO SPESSORE CRESCE CON IL COSTO DI RIMEDIARE – SCALA QUALITATIVA, ESEMPI NON MISURATI</text>
<text class="en" font-family="IBM Plex Mono, monospace" letter-spacing="1.1" x="0.0" y="98.0" font-size="14" fill="#8B9598" text-anchor="start">THE WEDGE THICKENS WITH THE COST OF PUTTING IT RIGHT – QUALITATIVE SCALE, NOT MEASURED</text>
